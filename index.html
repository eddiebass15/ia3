<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatKART - Your Gadget Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>PatKART</h2>
            </div>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search for products...">
                <button onclick="searchProducts()">Search</button>
            </div>
            <div class="nav-links">
                <a href="#" onclick="showSection('home')">Home</a>
                <a href="#" onclick="showSection('products')">Products</a>
                <a href="#" id="authLink" onclick="showSection('auth')">Login</a>
                <a href="#" id="adminLink" style="display:none;" onclick="showSection('admin')">Admin</a>
                <a href="#" onclick="showSection('cart')">Cart (<span id="cartCount">0</span>)</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Home Section -->
        <section id="home" class="section active">
            <div class="hero">
                <h1>Welcome to PatKART</h1>
                <p>Your one-stop destination for the latest gadgets</p>
                <button onclick="showSection('products')" class="cta-button">Shop Now</button>
            </div>
        </section>

        <!-- Auth Section -->
        <section id="auth" class="section">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showAuthTab('login')">Login</button>
                    <button class="tab-btn" onclick="showAuthTab('register')">Register</button>
                </div>
                
                <div id="login" class="auth-form active">
                    <h3>Login to Your Account</h3>
                    <form onsubmit="loginUser(event)">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <button type="submit">Login</button>
                    </form>
                </div>
                
                <div id="register" class="auth-form">
                    <h3>Create New Account</h3>
                    <form onsubmit="registerUser(event)">
                        <input type="text" id="registerName" placeholder="Full Name" required>
                        <input type="email" id="registerEmail" placeholder="Email" required>
                        <input type="password" id="registerPassword" placeholder="Password" required>
                        <button type="submit">Register</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Products Section -->
        <section id="products" class="section">
            <div class="products-header">
                <h2>Our Products</h2>
                <div class="filters">
                    <select id="categoryFilter" onchange="filterProducts()">
                        <option value="all">All Categories</option>
                        <option value="smartphones">Smartphones</option>
                        <option value="laptops">Laptops</option>
                        <option value="tablets">Tablets</option>
                        <option value="accessories">Accessories</option>
                    </select>
                    <select id="sortFilter" onchange="sortProducts()">
                        <option value="newest">Newest First</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                    </select>
                    <div class="price-range">
                        <input type="number" id="minPrice" placeholder="Min Price" onchange="filterByPrice()">
                        <input type="number" id="maxPrice" placeholder="Max Price" onchange="filterByPrice()">
                    </div>
                </div>
            </div>
            <div id="productsGrid" class="products-grid">
                <!-- Products will be loaded here -->
            </div>
        </section>

        <!-- Cart Section -->
        <section id="cart" class="section">
            <div class="cart-container">
                <h2>Your Shopping Cart</h2>
                <div id="cartItems" class="cart-items">
                    <!-- Cart items will be loaded here -->
                </div>
                <div class="cart-summary">
                    <h3>Total: ₹<span id="cartTotal">0</span></h3>
                    <button onclick="checkout()" class="checkout-btn">Proceed to Checkout</button>
                </div>
            </div>
        </section>

        <!-- Admin Section -->
        <section id="admin" class="section">
            <div class="admin-container">
                <h2>Admin Panel</h2>
                <div class="admin-actions">
                    <h3>Add New Product</h3>
                    <form onsubmit="addAdminProduct(event)">
                        <input type="text" id="adminProductName" placeholder="Product Name" required>
                        <input type="text" id="adminProductDesc" placeholder="Description" required>
                        <input type="number" id="adminProductPrice" placeholder="Price" required>
                        <select id="adminProductCategory" required>
                            <option value="smartphones">Smartphones</option>
                            <option value="laptops">Laptops</option>
                            <option value="tablets">Tablets</option>
                            <option value="accessories">Accessories</option>
                            <option value="gaming">Gaming</option>
                        </select>
                        <input type="text" id="adminProductImage" placeholder="Image URL" required>
                        <input type="text" id="adminProductBrand" placeholder="Brand" required>
                        <button type="submit">Add Product</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
